plugins {
    id 'dev.architectury.loom' version '1.3-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    forge {
        mixinConfigs = ['dungeons_iso.mixins.json']
    }
}

sourceSets {
    main {
        java.srcDirs = ['common/src/main/java', 'forge/src/main/java']
        resources.srcDirs = ['common/src/main/resources', 'forge/src/main/resources']
        java {
            // These integrations belong to the upstream Fabric/Sodium surface. Forge 1.20.1
            // intentionally builds the vanilla renderer path first; the runtime mixin plugin
            // already keeps these optional hooks disabled.
            exclude '**/mixin/compat/sodium/**'
            exclude '**/mixin/compat/combat_roll/**'
            exclude '**/compat/SodiumRebuildScheduler.java'
            exclude '**/config/Gui.java'
            exclude '**/config/ToggleableController.java'
            exclude '**/mixin/SoundSystemMixin.java'
            exclude '**/mixin/client/PlayerEntityMixin.java'
            exclude '**/network/Capabilities.java'
            exclude '**/ui/FirstTimeScreen.java'
            exclude '**/ui/LootUI.java'
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.isxander.dev/releases' }
    maven { url = 'https://maven.wispforest.io' }
    maven { url = 'https://maven.wispforest.io/releases/' }
    maven { url = 'https://maven.kosmx.dev/' }
    maven { url = 'https://maven.su5ed.dev/releases' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    forge "net.minecraftforge:forge:${forge_version}"

    // The common source uses Fabric names and a small amount of Fabric-loader discovery.
    // Sinytra supplies the compatible Fabric API surface on Forge; it is kept compile-only.
    modCompileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modCompileOnly "dev.su5ed.sinytra.fabric-api:fabric-api:${ffapi_version}"

    // Optional UI and compatibility integrations used by the upstream common code.
    modCompileOnly "dev.isxander:yet-another-config-lib:${yacl_version}"
    modCompileOnly "me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}"
    modCompileOnly "io.wispforest:owo-lib:${owo_version}"
    modCompileOnly "dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}"
    modImplementation "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
}

processResources {
    inputs.property 'version', project.version
    filteringCharset = 'UTF-8'

    filesMatching('META-INF/mods.toml') {
        expand version: project.version, forge_version: forge_version
    }
}

def targetJavaVersion = 17
java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJavaVersion
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
