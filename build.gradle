plugins {
    id 'dev.architectury.loom' version '1.3-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    forge {
        mixinConfigs = ['dungeons_iso.mixins.json']
    }
}

sourceSets {
    main {
        java.srcDirs = ['common/src/main/java', 'forge/src/main/java']
        resources.srcDirs = ['common/src/main/resources', 'forge/src/main/resources']
        java {
            // These integrations belong to the upstream Fabric/Sodium surface. The old
            // net.caffeinemc hooks stay out of the Forge 1.20.1 artifact, while the separate
            // string-targeted Embeddium 0.3.x hooks are loader-safe and remain compiled.
            exclude '**/mixin/compat/sodium/**'
            exclude '**/mixin/compat/combat_roll/**'
            exclude '**/compat/SodiumRebuildScheduler.java'
            exclude '**/mixin/SoundSystemMixin.java'
            exclude '**/mixin/client/PlayerEntityMixin.java'
            exclude '**/network/Capabilities.java'
            exclude '**/ui/FirstTimeScreen.java'
            exclude '**/ui/LootUI.java'
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.isxander.dev/releases' }
    maven { url = 'https://maven.wispforest.io' }
    maven { url = 'https://maven.wispforest.io/releases/' }
    maven { url = 'https://maven.kosmx.dev/' }
    maven { url = 'https://maven.su5ed.dev/releases' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    forge "net.minecraftforge:forge:${forge_version}"

    // The common source uses Fabric names and a small amount of Fabric-loader discovery.
    // Sinytra supplies the compatible Fabric API surface on Forge; it is kept compile-only.
    modCompileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modCompileOnly "dev.su5ed.sinytra.fabric-api:fabric-api:${ffapi_version}"

    // Optional compatibility integrations used by the upstream common code.
    modCompileOnly "io.wispforest:owo-lib:${owo_version}"
    modCompileOnly "dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}"

    // Embeddium 0.3.x is an optional local renderer dependency. It is compile-only so the mod
    // remains installable without Embeddium, while Mixin's annotation processor can still resolve
    // the old me.jellysquid target classes when building this branch against the user's instance.
    def embeddiumJar = file(findProperty('embeddium_jar') ?: 'D:/Minecraft/versions/Last One But 2/mods/[C][优化]embeddium-0.3.31+mc1.20.1.jar')
    if (embeddiumJar.exists()) {
        modCompileOnly files(embeddiumJar)
        if (findProperty('embeddium_runtime') == 'true') {
            modLocalRuntime files(embeddiumJar)
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filteringCharset = 'UTF-8'

    filesMatching('META-INF/mods.toml') {
        expand version: project.version, forge_version: forge_version
    }
}

def targetJavaVersion = 17
java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJavaVersion
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}

// Loom 1.3 exposes the inherited Jar copy action alongside its remap action on
// Gradle 8.12. The copy action has no sources here and overwrites the remapped
// artifact with an empty archive, so keep only Loom's worker action.
tasks.matching { it.name in ['remapJar', 'remapSourcesJar'] }.configureEach {
    actions.removeAll { action ->
        def methodField = action.class.getDeclaredField('method')
        methodField.accessible = true
        def method = methodField.get(action)
        method.name == 'copy' && method.declaringClass.name == 'org.gradle.api.tasks.AbstractCopyTask'
    }
}
