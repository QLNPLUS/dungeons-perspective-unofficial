# Builds the tagged Forge artifact and publishes it to CurseForge.
name: Publish to CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and publish, for example v2.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: curseforge-${{ github.repository }}-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  EMBEDDIUM_URL: https://cdn.modrinth.com/data/sk9rgfiA/versions/UTbfe5d1/embeddium-0.3.31%2Bmc1.20.1.jar
  EMBEDDIUM_SHA512: ffbf2da4685260a4d5c14c621708bd20722563f084f042d3dfb0a7b87f048e39299648c854a93939129da0d23a15a91ec628560d601e76074b08e275f6e132e9

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release version
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          test -n "$version"
          echo "CURSEFORGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID"
          test -n "$CURSEFORGE_TOKEN"

      - name: Download Embeddium build dependency
        shell: bash
        run: |
          mkdir -p build/dependencies
          curl --fail --location --retry 3 "$EMBEDDIUM_URL" \
            --output "build/dependencies/embeddium-0.3.31+mc1.20.1.jar"
          echo "$EMBEDDIUM_SHA512  build/dependencies/embeddium-0.3.31+mc1.20.1.jar" | sha512sum --check

      - name: Build mod
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            -Pmod_version="$CURSEFORGE_VERSION" \
            -Pembeddium_jar="$GITHUB_WORKSPACE/build/dependencies/embeddium-0.3.31+mc1.20.1.jar" \
            remapJar

      - name: Verify release artifact
        shell: bash
        run: |
          find build/libs -maxdepth 1 -type f -name '*.jar' -print
          expected="build/libs/dungeons_iso-${CURSEFORGE_VERSION}.jar"
          test -f "$expected"
          echo "CURSEFORGE_FILE=$expected" >> "$GITHUB_ENV"

      - name: Prepare current changelog
        shell: bash
        run: |
          awk -v version="$CURSEFORGE_VERSION" '
            /^##[[:space:]]+/ {
              heading = $2
              gsub(/^\[/, "", heading)
              gsub(/\].*$/, "", heading)
              if (found && heading != version) exit
              if (heading == version) found = 1
            }
            found { print }
          ' CHANGELOG.md > build/curseforge-changelog.md
          test -s build/curseforge-changelog.md

      - name: Publish to CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ env.CURSEFORGE_FILE }}
          version: ${{ env.CURSEFORGE_VERSION }}
          name: dungeons_iso-${{ env.CURSEFORGE_VERSION }}
          version-type: release
          changelog-file: build/curseforge-changelog.md
          loaders: forge
          game-versions: 1.20.1
          java: 17
